<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17152f"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>Full Body Forge</title></head><body><header><small>YOUR PROGRAMME</small><h1>Full Body Forge</h1></header><main>
<section id="today" class="page active"><div class="hero"><span id="dayTag">DAY A</span><h2 id="title"></h2><p id="coverage"></p></div><div id="todayList"></div><button class="primary" id="finish">Finish workout</button></section>
<section id="builder" class="page"><div class="heading"><h2>Workout Builder</h2><p>Add, remove, reorder and edit exercises, sets, rep ranges and starting loads.</p></div><div class="tabs" id="dayTabs"></div><div class="card"><label>Workout name<input id="planName"></label><label>Coverage note<input id="planCoverage"></label></div><div id="builderList"></div><button class="primary" id="addExercise">+ Add exercise</button></section>
<section id="progress" class="page"><div class="heading"><h2>Progress</h2></div><div class="card"><h3>Body weight</h3><div class="weight"><input id="weightValue" type="number" step="0.1" inputmode="decimal" placeholder="87.9"><button id="logWeight">Log</button></div><div id="weights"></div></div><div class="card"><h3>Training history</h3><div id="history"></div></div></section>
<section id="settings" class="page"><div class="heading"><h2>Settings</h2></div><div class="card"><label>Upper-body increment (kg)<input id="small" type="number" step="0.5"></label><label>Squat and hinge increment (kg)<input id="large" type="number" step="0.5"></label><button class="danger" id="reset">Reset all data</button></div></section></main>
<nav><button data-page="today" class="active">◉<b>Today</b></button><button data-page="builder">✎<b>Builder</b></button><button data-page="progress">⌁<b>Progress</b></button><button data-page="settings">⚙<b>Settings</b></button></nav>
<dialog id="picker"><form method="dialog"><div class="dialoghead"><h2>Choose exercise</h2><button value="cancel">×</button></div><label>Movement<select id="moveFilter"></select></label><label>Equipment<select id="equipFilter"></select></label><div id="choices"></div></form></dialog><script src="app.js"></script></body></html>
